name: medisync_mobile
description: Application mobile MediSync - Gestion de clinique medicale
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP & State
  http: ^1.2.0
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Maps - OpenStreetMap
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Biometric Auth
  local_auth: ^2.2.0

  # Location
  geolocator: ^11.0.0

  # Utils
  path: ^1.8.3
  intl: ^0.19.0
  url_launcher: ^6.2.4
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  path_provider: ^2.1.2
  pdf: ^3.10.7
  printing: ^5.12.0
  open_file: ^3.3.2
  timezone: ^0.9.2
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
